spring.application.name=DearMe
# deepseek starter AutoConfiguration 对 api-key 走 Assert.hasText，空字符串会炸启动。
# 这里给一个非空占位让 starter 装配过得了 Assert；真正的连接凭据由环境变量 DEEPSEEK_API_KEY 覆盖：
#   启用 deepseek 时 docker/env 设 DEEPSEEK_API_KEY=真 key，本占位被环境变量替换。
# 占位非密钥（dummy-token-placeholder），不构成密钥泄露；dearme.ai.backends.deepseek.enabled=false
# 时 ChatClientAiWorker 不装配，AiRouter 永不调 deepseek，占位 key 永不被消费。
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:dummy-token-placeholder}
spring.ai.deepseek.base-url=https://api.deepseek.com
spring.ai.deepseek.chat.options.model=deepseek-v4-flash
spring.ai.deepseek.chat.options.temperature=0.7

dearme.inference.scorer.temperature=3.0
dearme.inference.selector.same-dimension-penalty=0.5

dearme.data.characters-path=data/characters.json
dearme.data.questions-path=data/questions.json

dearme.session.expire-hours=24

dearme.payment.mock.enabled=true
dearme.payment.mock.success-rate=1.0
dearme.payment.mock.timeout-ms=500

dearme.ai.report.timeout-seconds=30

# AI 网关后端开关。默认两个都关 ——
# Router 在没 Worker 时只返 fail 让业务 adapter 自走降级，避免 Spring 启动直接挂。
# 启 deepseek（远端付费）：dearme.ai.backends.deepseek.enabled=true
# 启 Ollama（本地 CPU）：SPRING_PROFILES_ACTIVE=ollama + 见 application-ollama.properties
dearme.ai.backends.deepseek.enabled=false
dearme.ai.backends.ollama.enabled=false

# Nacos 配置覆盖层。server-addr 默认空 -> 不启 listener, 走 application defaults。
# 启用：启动加环境变量 NACOS_SERVER_ADDR=127.0.0.1:8848 即可订阅。
# 推下来的 backends.*.enabled 即时生效（AiRouter 入口过滤）；model/temperature 进 AiModelConfig 但 OllamaChatModel bean immutable,真换 model 是另一份工程（见 Plan §9）。
nacos.config.server-addr=${NACOS_SERVER_ADDR:}
nacos.config.data-id=dearme-ai-model.properties
nacos.config.group=DEFAULT_GROUP

dearme.persistence=memory

spring.datasource.url=${dearme.datasource.url:jdbc:postgresql://localhost:5432/dearme}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver