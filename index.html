<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <title>DearMe — 自我探索测试</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .homepage { padding:56px var(--gutter) 40px; max-width:var(--max-width); margin:0 auto;
      min-height:100vh; min-height:100dvh; }
    .homepage__brand { font-family:var(--font-serif); font-size:1.5rem; font-weight:400;
      color:var(--color-text); letter-spacing:0.06em; margin-bottom:8px; }
    .homepage__tagline { font-size:0.9375rem; color:var(--color-text-soft); line-height:1.7;
      margin-bottom:48px; }
    .test-list { display:flex; flex-direction:column; gap:16px; }
    .test-card { display:block; padding:28px 24px; border-radius:var(--radius-card);
      background:var(--color-card); text-decoration:none; color:inherit;
      box-shadow:0 1px 3px rgba(var(--color-shadow),0.06), 0 4px 16px rgba(var(--color-shadow),0.06);
      transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease; }
    .test-card:hover { transform:translateY(-4px);
      box-shadow:0 4px 12px rgba(var(--color-shadow),0.12), 0 12px 32px rgba(var(--color-shadow),0.10); }
    .test-card__title { font-family:var(--font-serif); font-size:1.2rem; color:var(--color-text);
      margin-bottom:6px; }
    .test-card__desc { font-size:0.875rem; color:var(--color-text-soft); line-height:1.5; }
    .test-card__arrow { display:inline-block; margin-top:12px; font-size:0.8125rem;
      color:var(--color-accent); letter-spacing:0.04em; }
    .homepage__footer { margin-top:64px; text-align:center; font-size:0.75rem;
      color:var(--color-text-faint); padding-bottom:24px; }
  </style>
</head>
<body>
  <div class="homepage">
    <h1 class="homepage__brand">DearMe</h1>
    <p class="homepage__tagline">没有复杂的心理学说教，帮你在浮躁的世界中<br />找回内心深处最真实的特质与灵魂色彩。</p>
    <div class="test-list">
      <a href="/test/city.html" class="test-card">
        <div class="test-card__title">你最适合的中国城市</div>
        <div class="test-card__desc">从气候到美食，从生活节奏到内心向往——找到与你灵魂共鸣的那座城。</div>
        <span class="test-card__arrow">→ 开始探索</span>
      </a>
    </div>
    <footer class="homepage__footer">DearMe · 认识自己，是一场值得认真对待的冒险</footer>
  </div>
</body>
</html>
